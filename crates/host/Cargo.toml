[package]
name = "westplay-host"
description = "Renders the WestPlay UI in an offscreen WebView2 and feeds the frames to the game plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
webview2-com = "0.39"
westplay-mapdata = { path = "../mapdata" }
westplay-setup = { path = "../setup" }
westplay-shared = { path = "../shared", features = ["serde"] }
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "System", "UI_Composition", "Graphics", "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_System_Com", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_WinRT", "Win32_System_WinRT_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm","Win32_System_WinRT_Composition", "UI_Composition_Desktop", "Win32_System_LibraryLoader", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
windows-core = "0.62"
windows-future = "0.3"
windows-numerics = "0.3"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
